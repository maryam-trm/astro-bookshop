services:
  bookshop:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
